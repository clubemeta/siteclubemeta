<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Teste Chat SDR · Clube Meta</title>
<style>
body{margin:0;background:#f0f4f8;font-family:sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:12px}
h1{color:#0899B2;margin:0}p{color:#666;font-size:.9rem;margin:0}
/* ── CHAT ── */
.cm-fab{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.cm-tip{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:9px 14px;font-size:.8rem;font-weight:600;color:#0d1117;box-shadow:0 4px 12px rgba(0,0,0,.1);cursor:pointer}
.cm-tip span{color:#0899B2;display:block;font-size:.72rem}
.cm-btn{width:58px;height:58px;border-radius:50%;background:#0899B2;border:none;cursor:pointer;box-shadow:0 4px 20px rgba(8,153,178,.5);display:flex;align-items:center;justify-content:center;position:relative}
.cm-btn:hover{transform:scale(1.06)}
.cm-btn svg{color:#fff}
.cm-ring{position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(8,153,178,.35);animation:cmring 2s ease-out infinite;pointer-events:none}
@keyframes cmring{0%{transform:scale(1);opacity:1}100%{transform:scale(1.5);opacity:0}}
.cm-panel{position:fixed;bottom:94px;right:24px;width:358px;height:540px;background:#fff;border:1px solid #e2e8f0;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.15);display:flex;flex-direction:column;overflow:hidden;z-index:9998;transform:translateY(14px) scale(.96);opacity:0;pointer-events:none;transition:transform .3s ease,opacity .3s ease}
.cm-panel.on{transform:translateY(0) scale(1);opacity:1;pointer-events:all}
@media(max-width:480px){.cm-panel{width:calc(100vw - 20px);right:10px;bottom:84px;height:65vh}}
.cm-head{background:#0899B2;padding:14px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.cm-av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.8rem;color:#fff;border:2px solid rgba(255,255,255,.3);flex-shrink:0}
.cm-info{flex:1}
.cm-nm{font-weight:700;font-size:.9rem;color:#fff}
.cm-st{font-size:.72rem;color:rgba(255,255,255,.8);display:flex;align-items:center;gap:5px;margin-top:2px}
.cm-dot{width:6px;height:6px;border-radius:50%;background:#4ade80;animation:blink 1.5s infinite;flex-shrink:0}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.cm-x{background:rgba(255,255,255,.15);border:none;border-radius:7px;width:28px;height:28px;color:#fff;cursor:pointer;font-size:.9rem;display:flex;align-items:center;justify-content:center}
.cm-x:hover{background:rgba(255,255,255,.25)}
.cm-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px;background:#f8fafc}
.cm-msg-b,.cm-msg-u{display:flex;gap:7px;align-items:flex-end;animation:msgin .25s ease}
@keyframes msgin{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.cm-msg-b{align-self:flex-start;max-width:88%}
.cm-msg-u{flex-direction:row-reverse;align-self:flex-end;max-width:85%}
.cm-av2{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:800;color:#fff;flex-shrink:0}
.cm-bbl-b{background:#fff;color:#0d1117;border:1px solid #e2e8f0;border-radius:14px;border-bottom-left-radius:3px;padding:9px 13px;font-size:.82rem;line-height:1.5;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.cm-bbl-u{background:#0899B2;color:#fff;border-radius:14px;border-bottom-right-radius:3px;padding:9px 13px;font-size:.82rem;line-height:1.5}
.cm-t{font-size:.62rem;color:#94a3b8;padding:0 3px;margin-top:2px}
.cm-dots-wrap{display:flex;gap:4px;padding:11px 14px}
.cm-dots-wrap span{width:7px;height:7px;border-radius:50%;background:#94a3b8;animation:dot 1.2s ease infinite}
.cm-dots-wrap span:nth-child(2){animation-delay:.15s}
.cm-dots-wrap span:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}
.cm-qr{padding:0 14px 10px;background:#f8fafc;display:flex;flex-wrap:wrap;gap:6px;min-height:0}
.cm-qb{background:#fff;border:1px solid #0899B2;color:#0899B2;border-radius:100px;padding:5px 13px;font-size:.76rem;font-weight:600;cursor:pointer}
.cm-qb:hover{background:#0899B2;color:#fff}
.cm-card{background:linear-gradient(135deg,#0899B2,#0779a0);border-radius:12px;padding:14px;color:#fff;margin:4px 0}
.cm-ct{font-weight:800;font-size:.85rem;margin-bottom:8px}
.cm-cb{font-size:.76rem;line-height:1.6;opacity:.92}
.cm-wb{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:#25d366;color:#fff;border:none;border-radius:9px;padding:11px;font-weight:700;font-size:.85rem;cursor:pointer;margin-top:10px}
.cm-wb:hover{background:#1da851}
.cm-foot{padding:10px 12px;border-top:1px solid #e2e8f0;display:flex;gap:8px;background:#fff;flex-shrink:0}
.cm-inp{flex:1;border:1px solid #e2e8f0;border-radius:9px;padding:8px 12px;font-size:.82rem;outline:none;font-family:inherit;color:#0d1117;background:#f8fafc;resize:none;max-height:72px;overflow-y:auto}
.cm-inp:focus{border-color:#0899B2}
.cm-inp::placeholder{color:#94a3b8}
.cm-snd{width:36px;height:36px;border-radius:9px;background:#0899B2;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;align-self:flex-end}
.cm-snd:hover{background:#0779a0}
.cm-snd:disabled{opacity:.4;cursor:not-allowed}
.cm-pw{text-align:center;font-size:.62rem;color:#94a3b8;padding:4px 0 2px;background:#fff}
</style>
</head>
<body>
<h1>Clube Meta · Teste SDR</h1>
<p>Clique na bolinha teal no canto inferior direito 👇</p>

<!-- CHAT FAB -->
<div class="cm-fab" id="cmFab">
  <div class="cm-tip" id="cmTip">💬 Fale com nossa especialista<span>Diagnóstico gratuito em minutos</span></div>
  <button class="cm-btn" id="cmBtn" aria-label="Abrir chat">
    <div class="cm-ring"></div>
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
  </button>
</div>

<!-- CHAT PANEL -->
<div class="cm-panel" id="cmPanel">
  <div class="cm-head">
    <div class="cm-av" id="cmAv" style="background:#0899B2">FN</div>
    <div class="cm-info">
      <div class="cm-nm" id="cmNm">Fernanda Nunes</div>
      <div class="cm-st"><div class="cm-dot"></div><span id="cmRole">Especialista · Clube Meta</span></div>
    </div>
    <button class="cm-x" id="cmXBtn">✕</button>
  </div>
  <div class="cm-msgs" id="cmMsgs"></div>
  <div class="cm-qr" id="cmQr"></div>
  <div class="cm-foot">
    <textarea class="cm-inp" id="cmInp" placeholder="Digite sua mensagem..." rows="1"></textarea>
    <button class="cm-snd" id="cmSnd">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>
  <div class="cm-pw">⚡ Clube Meta · SDR com IA</div>
</div>

<script>
// ── CONFIG ──
var CM_WPP = '5586999923244';
var CM_SB = 'https://iyjmpbqpifvzitulccky.supabase.co';
var CM_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml5am1wYnFwaWZ2eml0dWxjY2t5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1MTM1NjEsImV4cCI6MjA5NjA4OTU2MX0.VFV6Kx44ZxmzgPcqv7DC3DgRqVppug1IvdRy2C_O4uE';

var SDRS = [
  {n:'Mariana Alves', r:'Especialista Nicho Médico', i:'MA', c:'#a78bfa'},
  {n:'Fernanda Nunes', r:'Especialista Concursos e Info', i:'FN', c:'#0899B2'},
  {n:'Juliana Castro', r:'Especialista E-commerce e Local', i:'JC', c:'#34d399'}
];
var sdr = SDRS[Math.floor(Math.random() * 3)];

// Set SDR info
document.getElementById('cmAv').textContent = sdr.i;
document.getElementById('cmAv').style.background = sdr.c;
document.getElementById('cmNm').textContent = sdr.n;
document.getElementById('cmRole').textContent = sdr.r;

var isOpen = false;
var hist = [];
var busy = false;
var done = false;

// ── TOGGLE ──
function toggleChat() {
  isOpen = !isOpen;
  if (isOpen) {
    document.getElementById('cmPanel').classList.add('on');
    document.getElementById('cmTip').style.display = 'none';
    if (hist.length === 0) {
      setTimeout(function() {
        addBot('Olá! Sou ' + sdr.n + ' da Clube Meta.\n\nVou fazer um diagnóstico rápido do seu negócio. Me diz: qual é o seu nome e WhatsApp?');
      }, 600);
    }
    setTimeout(function() { document.getElementById('cmInp').focus(); }, 350);
  } else {
    document.getElementById('cmPanel').classList.remove('on');
  }
}

// Event listeners (no onclick attributes)
document.getElementById('cmBtn').addEventListener('click', toggleChat);
document.getElementById('cmXBtn').addEventListener('click', toggleChat);
document.getElementById('cmTip').addEventListener('click', function() { if (!isOpen) toggleChat(); });

document.getElementById('cmInp').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
});
document.getElementById('cmInp').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 72) + 'px';
});
document.getElementById('cmSnd').addEventListener('click', sendMsg);

// ── SEND ──
function sendMsg() {
  if (busy || done) return;
  var v = document.getElementById('cmInp').value.trim();
  if (!v) return;
  document.getElementById('cmInp').value = '';
  document.getElementById('cmInp').style.height = 'auto';
  addUser(v);
  hist.push({role: 'user', content: v});
  document.getElementById('cmQr').innerHTML = '';
  getAI();
}

// ── AI ──
function getAI() {
  busy = true;
  showDots();
  var messages = hist.map(function(m) { return {role: m.role, content: m.content}; });
  setTimeout(function() {
    fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'x-api-key': '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', 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true'},
      body: JSON.stringify({
        model: 'claude-haiku-4-5-20251001',
        max_tokens: 400,
        system: 'Você é ' + sdr.n + ', SDR da Clube Meta — agência que gerenciou mais de R$50M em tráfego pago. Colete de forma NATURAL: nome, WhatsApp, email, Instagram, nicho, faturamento, se anuncia e qual plataforma, investimento/mês, maior desafio, estrutura de vendas, meta 90 dias, cidade. Máx 2 perguntas por vez. NUNCA diga que é IA. Quando tiver tudo envie: [[LEAD]]nome=X&wpp=X&email=X&ig=X&nicho=X&fat=X&plat=X&inv=X&desafio=X&meta=X&cidade=X[[/LEAD]]',
        messages: messages
      })
    })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      hideDots();
      busy = false;
      var full = d.content && d.content[0] ? d.content[0].text : 'Erro na resposta';
      var match = full.match(/\[\[LEAD\]\]([\s\S]*?)\[\[\/LEAD\]\]/);
      var display = full.replace(/\[\[LEAD\]\][\s\S]*?\[\[\/LEAD\]\]/, '').trim();
      hist.push({role: 'assistant', content: full});
      addBot(display);
      if (match) { done = true; setTimeout(function() { showCard(match[1]); }, 600); }
      else suggestQR(display);
    })
    .catch(function(err) {
      hideDots();
      busy = false;
      addBot('Hmm, tive um probleminha. Pode repetir? ');
    });
  }, 800 + Math.floor(Math.random() * 500));
}

// ── MESSAGES ──
function addBot(txt) {
  var msgs = document.getElementById('cmMsgs');
  var d = document.createElement('div');
  d.className = 'cm-msg-b';
  var fmt = esc(txt).replace(/\n/g, '<br>');
  d.innerHTML = '<div class="cm-av2" style="background:' + sdr.c + '">' + sdr.i + '</div>'
    + '<div><div class="cm-bbl-b">' + fmt + '</div><div class="cm-t">' + getTime() + '</div></div>';
  msgs.appendChild(d);
  msgs.scrollTop = msgs.scrollHeight;
}

function addUser(txt) {
  var msgs = document.getElementById('cmMsgs');
  var d = document.createElement('div');
  d.className = 'cm-msg-u';
  d.innerHTML = '<div class="cm-bbl-u">' + esc(txt) + '</div><div class="cm-t">' + getTime() + '</div>';
  msgs.appendChild(d);
  msgs.scrollTop = msgs.scrollHeight;
}

function showDots() {
  var msgs = document.getElementById('cmMsgs');
  var d = document.createElement('div');
  d.className = 'cm-msg-b'; d.id = 'cmDots';
  d.innerHTML = '<div class="cm-av2" style="background:' + sdr.c + '">' + sdr.i + '</div>'
    + '<div class="cm-bbl-b" style="padding:4px 8px"><div class="cm-dots-wrap"><span></span><span></span><span></span></div></div>';
  msgs.appendChild(d);
  msgs.scrollTop = msgs.scrollHeight;
}

function hideDots() {
  var d = document.getElementById('cmDots');
  if (d) d.remove();
}

function showCard(raw) {
  var p = new URLSearchParams(raw);
  var lead = {
    nome: p.get('nome') || '',
    whatsapp: p.get('wpp') || '',
    email: p.get('email') || '',
    instagram: p.get('ig') || '',
    nicho: p.get('nicho') || '',
    faturamento: p.get('fat') || '',
    plataforma: p.get('plat') || '',
    investimento: p.get('inv') || '',
    desafio: p.get('desafio') || '',
    meta_90_dias: p.get('meta') || '',
    cidade: p.get('cidade') || '',
    sdr_atendente: sdr.n
  };
  // Save Supabase
  fetch(CM_SB + '/rest/v1/clubemeta_leads', {
    method: 'POST',
    headers: {'Content-Type':'application/json','apikey':CM_KEY,'Authorization':'Bearer '+CM_KEY,'Prefer':'return=minimal'},
    body: JSON.stringify(lead)
  }).catch(function(){});
  // Show card
  var msgs = document.getElementById('cmMsgs');
  var card = document.createElement('div');
  card.className = 'cm-card';
  card.innerHTML = '<div class="cm-ct">Diagnóstico Concluído!</div>'
    + '<div class="cm-cb">'
    + ' ' + esc(lead.nome) + '<br>'
    + ' ' + esc(lead.whatsapp) + '<br>'
    + ' ' + esc(lead.nicho) + ' ' + esc(lead.faturamento) + '<br>'
    + ' Meta: ' + esc(lead.meta_90_dias)
    + '</div>'
    + '<button class="cm-wb" id="cmWppBtn"> Falar com estrategista</button>';
  msgs.appendChild(card);
  msgs.scrollTop = msgs.scrollHeight;
  document.getElementById('cmWppBtn').addEventListener('click', function() {
    var msg = 'LEAD CLUBE META\n'
      + 'Nome: ' + lead.nome + '\nWpp: ' + lead.whatsapp
      + '\nEmail: ' + lead.email + '\nIG: ' + lead.instagram
      + '\nNicho: ' + lead.nicho + '\nFat: ' + lead.faturamento
      + '\nPlat: ' + lead.plataforma + ' ' + lead.investimento + '/mes'
      + '\nDesafio: ' + lead.desafio + '\nMeta: ' + lead.meta_90_dias
      + '\nCidade: ' + lead.cidade + '\nSDR: ' + lead.sdr_atendente;
    window.open('https://wa.me/' + CM_WPP + '?text=' + encodeURIComponent(msg), '_blank');
  });
  document.getElementById('cmInp').disabled = true;
  document.getElementById('cmSnd').disabled = true;
  document.getElementById('cmInp').placeholder = 'Conversa concluída';
}

function suggestQR(txt) {
  var t = txt.toLowerCase();
  var opts = [];
  if (t.indexOf('faturamento') > -1) opts = ['Menos de R$10k','R$10k-50k','R$50k-200k','Acima de R$200k'];
  else if (t.indexOf('plataforma') > -1 || t.indexOf('anunci') > -1) opts = ['Meta Ads','Google Ads','Ambas','Nao invisto ainda'];
  else if (t.indexOf('equipe') > -1 || t.indexOf('sozinho') > -1) opts = ['Trabalho sozinho','Tenho equipe pequena','Equipe estruturada'];
  var qr = document.getElementById('cmQr');
  qr.innerHTML = '';
  opts.forEach(function(o) {
    var b = document.createElement('button');
    b.className = 'cm-qb'; b.textContent = o;
    b.addEventListener('click', function() {
      document.getElementById('cmInp').value = o;
      sendMsg();
    });
    qr.appendChild(b);
  });
}

function getTime() { return new Date().toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'}); }
function esc(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// Hide tip after 8s
setTimeout(function() {
  var t = document.getElementById('cmTip');
  if (t && !isOpen) { t.style.opacity = '0'; t.style.transition = 'opacity .5s'; }
}, 8000);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Teste Chat SDR</title>
<style>body{margin:0;background:#f4f6f8;font-family:sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column}h1{color:#0899B2;margin-bottom:8px}p{color:#666;font-size:.9rem}</style>
</head>
<body>
<h1>Clube Meta · Teste do Chat SDR</h1>
<p>Clique na bolinha teal no canto inferior direito 👇</p>

<!-- ═══ CHAT SDR CLUBE META ═══ -->
<style>
.cm-fab{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.cm-btn{width:58px;height:58px;border-radius:50%;background:#0899B2;border:none;cursor:pointer;box-shadow:0 4px 20px rgba(8,153,178,.5);display:flex;align-items:center;justify-content:center;position:relative;transition:transform .2s}
.cm-btn:hover{transform:scale(1.08)}
.cm-btn svg{color:#fff;pointer-events:none}
.cm-ring{position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(8,153,178,.35);animation:cmring 2s ease-out infinite}
@keyframes cmring{0%{transform:scale(1);opacity:1}100%{transform:scale(1.5);opacity:0}}
.cm-tip{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:9px 14px;font-size:.8rem;font-weight:600;color:#0d1117;box-shadow:0 4px 12px rgba(0,0,0,.1);cursor:pointer;white-space:nowrap}
.cm-tip span{color:#0899B2}
.cm-panel{position:fixed;bottom:96px;right:24px;width:360px;height:540px;background:#fff;border:1px solid #e2e8f0;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.15);display:flex;flex-direction:column;overflow:hidden;z-index:9998;transform:translateY(16px) scale(.96);opacity:0;pointer-events:none;transition:all .3s cubic-bezier(.16,1,.3,1)}
.cm-panel.on{transform:translateY(0) scale(1);opacity:1;pointer-events:all}
@media(max-width:480px){.cm-panel{width:calc(100vw - 20px);right:10px;bottom:84px;height:65vh}}
.cm-head{background:#0899B2;padding:14px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.cm-av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.8rem;color:#fff;border:2px solid rgba(255,255,255,.3);flex-shrink:0}
.cm-info{flex:1}
.cm-nm{font-weight:700;font-size:.9rem;color:#fff}
.cm-st{font-size:.72rem;color:rgba(255,255,255,.8);display:flex;align-items:center;gap:5px;margin-top:1px}
.cm-green{width:6px;height:6px;border-radius:50%;background:#4ade80;animation:blink 1.5s infinite;flex-shrink:0}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.cm-x{background:rgba(255,255,255,.15);border:none;border-radius:7px;width:28px;height:28px;color:#fff;cursor:pointer;font-size:.95rem;display:flex;align-items:center;justify-content:center;transition:background .2s}
.cm-x:hover{background:rgba(255,255,255,.25)}
.cm-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px;background:#f8fafc}
.cm-msgs::-webkit-scrollbar{width:3px}
.cm-msgs::-webkit-scrollbar-thumb{background:#e2e8f0;border-radius:2px}
.cm-msg{display:flex;gap:7px;align-items:flex-end;animation:msgin .25s ease}
@keyframes msgin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.cm-msg.u{flex-direction:row-reverse;align-self:flex-end;max-width:85%}
.cm-msg.b{align-self:flex-start;max-width:88%}
.cm-mav{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:800;color:#fff;flex-shrink:0}
.cm-bbl{padding:9px 13px;border-radius:14px;font-size:.82rem;line-height:1.5;word-break:break-word}
.cm-msg.b .cm-bbl{background:#fff;color:#0d1117;border:1px solid #e2e8f0;border-bottom-left-radius:3px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.cm-msg.u .cm-bbl{background:#0899B2;color:#fff;border-bottom-right-radius:3px}
.cm-time{font-size:.62rem;color:#94a3b8;padding:0 3px}
.cm-dots{display:flex;align-items:center;gap:4px;padding:11px 14px}
.cm-dots span{width:7px;height:7px;border-radius:50%;background:#94a3b8;animation:dot 1.2s ease infinite}
.cm-dots span:nth-child(2){animation-delay:.15s}
.cm-dots span:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}
.cm-qr{padding:0 14px 10px;background:#f8fafc;display:flex;flex-wrap:wrap;gap:6px}
.cm-qrbtn{background:#fff;border:1px solid #0899B2;color:#0899B2;border-radius:100px;padding:5px 13px;font-size:.76rem;font-weight:600;cursor:pointer;transition:all .15s}
.cm-qrbtn:hover{background:#0899B2;color:#fff}
.cm-card{background:linear-gradient(135deg,#0899B2,#0779a0);border-radius:12px;padding:14px;margin:4px 0;color:#fff}
.cm-card-t{font-weight:800;font-size:.85rem;margin-bottom:8px}
.cm-card-b{font-size:.76rem;line-height:1.6;opacity:.92}
.cm-wppbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:#25d366;color:#fff;border:none;border-radius:9px;padding:11px;font-weight:700;font-size:.85rem;cursor:pointer;margin-top:10px;transition:background .2s}
.cm-wppbtn:hover{background:#1da851}
.cm-foot{padding:10px 12px;border-top:1px solid #e2e8f0;display:flex;gap:8px;background:#fff;flex-shrink:0}
.cm-inp{flex:1;border:1px solid #e2e8f0;border-radius:9px;padding:8px 12px;font-size:.82rem;outline:none;font-family:inherit;color:#0d1117;background:#f8fafc;transition:border-color .2s;resize:none;max-height:72px;overflow-y:auto}
.cm-inp:focus{border-color:#0899B2}
.cm-inp::placeholder{color:#94a3b8}
.cm-send{width:36px;height:36px;border-radius:9px;background:#0899B2;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;align-self:flex-end;transition:background .2s}
.cm-send:hover{background:#0779a0}
.cm-send:disabled{opacity:.4;cursor:not-allowed}
.cm-pw{text-align:center;font-size:.62rem;color:#94a3b8;padding:4px 0 2px;background:#fff}
</style>

<div class="cm-fab" id="cmFab">
  <div class="cm-tip" id="cmTip" onclick="cmOpen()">💬 Fale com nossa especialista<br><span>Diagnóstico gratuito em minutos</span></div>
  <button class="cm-btn" id="cmBtn" onclick="cmToggle()" aria-label="Abrir chat">
    <div class="cm-ring"></div>
    <svg id="cmIco1" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
    <svg id="cmIco2" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="display:none"><path d="M18 6L6 18M6 6l12 12"/></svg>
  </button>
</div>

<div class="cm-panel" id="cmPanel">
  <div class="cm-head">
    <div class="cm-av" id="cmAv"></div>
    <div class="cm-info">
      <div class="cm-nm" id="cmNm"></div>
      <div class="cm-st"><div class="cm-green"></div><span id="cmRole"></span></div>
    </div>
    <button class="cm-x" onclick="cmToggle()">✕</button>
  </div>
  <div class="cm-msgs" id="cmMsgs"></div>
  <div class="cm-qr" id="cmQr"></div>
  <div class="cm-foot">
    <textarea class="cm-inp" id="cmInp" placeholder="Digite sua mensagem..." rows="1"></textarea>
    <button class="cm-send" id="cmSend">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>
  <div class="cm-pw">⚡ Clube Meta · SDR com IA</div>
</div>

<script>
(function(){
'use strict';

var WPP = '5586999923244';
var SB_URL = 'https://iyjmpbqpifvzitulccky.supabase.co';
var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml5am1wYnFwaWZ2eml0dWxjY2t5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1MTM1NjEsImV4cCI6MjA5NjA4OTU2MX0.VFV6Kx44ZxmzgPcqv7DC3DgRqVppug1IvdRy2C_O4uE';

// UTM
var utms = (function(){
  var p = new URLSearchParams(window.location.search);
  return {src:p.get('utm_source')||'',med:p.get('utm_medium')||'',camp:p.get('utm_campaign')||''};
})();

// Personas
var SDRS = [
  {n:'Mariana Alves', r:'Especialista · Nicho Médico', i:'MA', c:'#a78bfa'},
  {n:'Fernanda Nunes', r:'Especialista · Concursos & Info', i:'FN', c:'#0899B2'},
  {n:'Juliana Castro', r:'Especialista · E-commerce & Local', i:'JC', c:'#34d399'}
];
var sdr = SDRS[Math.floor(Math.random()*3)];

// State
var open = false;
var hist = [];
var busy = false;
var done = false;

// Init UI
document.getElementById('cmAv').textContent = sdr.i;
document.getElementById('cmAv').style.background = sdr.c;
document.getElementById('cmNm').textContent = sdr.n;
document.getElementById('cmRole').textContent = sdr.r;

// Hide tip after 8s
setTimeout(function(){
  var t = document.getElementById('cmTip');
  if(t && !open){ t.style.opacity='0'; t.style.transition='opacity .5s'; }
}, 8000);

// Input handlers
var inp = document.getElementById('cmInp');
inp.addEventListener('keydown', function(e){
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); cmSend(); }
});
inp.addEventListener('input', function(){
  this.style.height='auto';
  this.style.height = Math.min(this.scrollHeight,72)+'px';
});

document.getElementById('cmSend').addEventListener('click', cmSend);

// Public functions
window.cmToggle = function(){
  open = !open;
  document.getElementById('cmPanel').classList.toggle('on', open);
  document.getElementById('cmIco1').style.display = open?'none':'block';
  document.getElementById('cmIco2').style.display = open?'block':'none';
  document.getElementById('cmTip').style.display = 'none';
  if(open && hist.length===0) start();
  if(open) setTimeout(function(){ document.getElementById('cmInp').focus(); }, 350);
};
window.cmOpen = function(){ if(!open) window.cmToggle(); };

function start(){
  wait(700, function(){
    bot('Olá! 👋 Sou **'+sdr.n+'**, especialista da Clube Meta.

Estou aqui para entender seu negócio e ver como podemos te ajudar a crescer com tráfego pago.

Comece me dizendo: qual o seu **nome** e **WhatsApp**? 😊');
  });
}

function cmSend(){
  if(busy || done) return;
  var v = inp.value.trim();
  if(!v) return;
  inp.value=''; inp.style.height='auto';
  addMsg(v, 'u');
  hist.push({role:'user', content:v});
  clearQR();
  ask(v);
}

function ask(txt){
  busy = true;
  showDots();
  var msgs = hist.map(function(m){ return {role:m.role, content:m.content}; });
  setTimeout(function(){
    fetch('/api/chat', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        model:'claude-haiku-4-5-20251001',
        max_tokens:400,
        system: buildPrompt(),
        messages: msgs
      })
    })
    .then(function(r){ return r.json(); })
    .then(function(d){
      hideDots();
      busy = false;
      var full = d.content && d.content[0] ? d.content[0].text : '';
      var match = full.match(/\[\[LEAD\]\]([\s\S]*?)\[\[\/LEAD\]\]/);
      var display = full.replace(/\[\[LEAD\]\][\s\S]*?\[\[\/LEAD\]\]/, '').trim();
      hist.push({role:'assistant', content:full});
      wait(150, function(){
        bot(display);
        if(match){ done=true; wait(800, function(){ qualify(match[1]); }); }
        else setQR(display);
      });
    })
    .catch(function(){
      hideDots();
      busy = false;
      bot('Tive um probleminha técnico. Pode repetir? 😅');
    });
  }, 800 + Math.floor(Math.random()*600));
}

function buildPrompt(){
  return 'Você é '+sdr.n+', SDR especialista da Clube Meta — agência que já gerenciou mais de R$50 milhões em tráfego pago, fundada por Luciano Barros.

PERSONALIDADE: Consultiva, direta, empática e confiante. Linguagem informal mas profissional.

OBJETIVO: Coletar de forma NATURAL e CONVERSACIONAL:
1. Nome
2. WhatsApp
3. E-mail
4. Instagram
5. Nicho/tipo de negócio
6. Faturamento mensal
7. Se já investe em tráfego e qual plataforma
8. Investimento mensal em anúncios
9. Maior desafio com marketing
10. Se tem estrutura: LP, funil, CRM, equipe
11. O que acontece com o lead após captação
12. Meta para 90 dias
13. Cidade/estado

REGRAS:
- Máx 2 perguntas por mensagem
- Use o nome assim que souber
- NUNCA diga que é IA ou bot
- Respostas curtas e empáticas
- Quando tiver TUDO, finalize com:
[[LEAD]]nome=[n]&wpp=[w]&email=[e]&ig=[i]&nicho=[ni]&fat=[f]&plat=[p]&inv=[inv]&desafio=[d]&estrutura=[est]&pos=[pos]&meta=[m]&cidade=[c][[/LEAD]]';
}

function qualify(raw){
  var p = new URLSearchParams(raw);
  var lead = {
    nome: p.get('nome')||'',
    whatsapp: p.get('wpp')||'',
    email: p.get('email')||'',
    instagram: p.get('ig')||'',
    nicho: p.get('nicho')||'',
    faturamento: p.get('fat')||'',
    plataforma: p.get('plat')||'',
    investimento: p.get('inv')||'',
    desafio: p.get('desafio')||'',
    estrutura: p.get('est')||'',
    pos_captacao: p.get('pos')||'',
    meta_90_dias: p.get('meta')||'',
    cidade: p.get('cidade')||'',
    sdr_atendente: sdr.n,
    utm_source: utms.src,
    utm_medium: utms.med,
    utm_campaign: utms.camp,
    pagina_origem: window.location.href,
    conversa: hist
  };

  // Save Supabase
  fetch(SB_URL+'/rest/v1/clubemeta_leads', {
    method:'POST',
    headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Prefer':'return=minimal'},
    body: JSON.stringify(lead)
  }).catch(function(){});

  // Save localStorage
  try{ localStorage.setItem('cm_lead', JSON.stringify(lead)); }catch(e){}

  showCard(lead);
  document.getElementById('cmInp').disabled = true;
  document.getElementById('cmSend').disabled = true;
  document.getElementById('cmInp').placeholder = 'Conversa concluída ✅';
}

function showCard(lead){
  var msgs = document.getElementById('cmMsgs');
  var d = document.createElement('div');
  d.className = 'cm-card';
  d.innerHTML = '<div class="cm-card-t">✅ Diagnóstico Concluído!</div>'
    +'<div class="cm-card-b">'
    +'👤 <b>'+esc(lead.nome)+'</b><br>'
    +'📱 '+esc(lead.whatsapp)+'<br>'
    +'✉️ '+esc(lead.email)+'<br>'
    +'📸 '+esc(lead.instagram)+'<br>'
    +'🏢 '+esc(lead.nicho)+' · '+esc(lead.faturamento)+'<br>'
    +'🎯 '+esc(lead.meta_90_dias)
    +'</div>'
    +'<button class="cm-wppbtn" id="wppLeadBtn">📲 Falar com estrategista agora</button>';
  msgs.appendChild(d);
  scroll();
  document.getElementById('wppLeadBtn').addEventListener('click', function(){
    var utm = utms.src ? '
📡 UTM: '+utms.src+' / '+utms.camp : '';
    var msg = '🤖 *LEAD — CLUBE META*
'
      +'👤 '+lead.nome+'
📱 '+lead.whatsapp+'
✉️ '+lead.email+'
📸 '+lead.instagram
      +'
🏢 '+lead.nicho+' · '+lead.faturamento
      +'
📡 '+lead.plataforma+' · '+lead.investimento+'/mês'
      +'
😰 '+lead.desafio+'
🎯 '+lead.meta_90_dias+'
📍 '+lead.cidade
      +'
🤝 SDR: '+lead.sdr_atendente+utm
      +'

✅ Salvo no Supabase';
    window.open('https://wa.me/'+WPP+'?text='+encodeURIComponent(msg), '_blank');
  });
}

function addMsg(txt, type){
  var msgs = document.getElementById('cmMsgs');
  var d = document.createElement('div');
  d.className = 'cm-msg '+type;
  var fmt = esc(txt).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/
/g,'<br>');
  if(type==='b'){
    d.innerHTML = '<div class="cm-mav" style="background:'+sdr.c+'">'+sdr.i+'</div>'
      +'<div><div class="cm-bbl">'+fmt+'</div><div class="cm-time">'+time()+'</div></div>';
  } else {
    d.innerHTML = '<div class="cm-bbl">'+fmt+'</div><div class="cm-time">'+time()+'</div>';
  }
  msgs.appendChild(d);
  scroll();
}

function bot(txt){ addMsg(txt, 'b'); }

function showDots(){
  var msgs = document.getElementById('cmMsgs');
  var d = document.createElement('div');
  d.className='cm-msg b'; d.id='cmDots';
  d.innerHTML='<div class="cm-mav" style="background:'+sdr.c+'">'+sdr.i+'</div>'
    +'<div class="cm-bbl" style="padding:4px 8px"><div class="cm-dots"><span></span><span></span><span></span></div></div>';
  msgs.appendChild(d); scroll();
}

function hideDots(){ var d=document.getElementById('cmDots'); if(d)d.remove(); }

function setQR(txt){
  var t = txt.toLowerCase();
  if(t.indexOf('faturamento')>-1 || (t.indexOf('quanto')>-1 && t.indexOf('mês')>-1))
    qr(['Menos de R$10k','R$10k–50k','R$50k–200k','Acima de R$200k']);
  else if(t.indexOf('plataforma')>-1 || t.indexOf('anunci')>-1 || t.indexOf('investe')>-1)
    qr(['Meta Ads','Google Ads','Ambas','Não invisto ainda']);
  else if(t.indexOf('equipe')>-1 || t.indexOf('sozinho')>-1)
    qr(['Trabalho sozinho','Tenho equipe pequena','Equipe estruturada']);
  else clearQR();
}

function qr(opts){
  var el = document.getElementById('cmQr');
  el.innerHTML='';
  opts.forEach(function(o){
    var b=document.createElement('button');
    b.className='cm-qrbtn'; b.textContent=o;
    b.addEventListener('click', function(){ inp.value=o; cmSend(); });
    el.appendChild(b);
  });
}
function clearQR(){ document.getElementById('cmQr').innerHTML=''; }
function scroll(){ var m=document.getElementById('cmMsgs'); m.scrollTop=m.scrollHeight; }
function time(){ return new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
function wait(ms, fn){ setTimeout(fn, ms); }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

})();
</script>

</body>
</html>

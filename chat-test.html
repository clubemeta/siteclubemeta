<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Teste Chat SDR</title>
<style>
body{margin:0;background:#f0f0f0;font-family:'Open Sans',sans-serif}
h1{text-align:center;padding:40px;color:#333}
:root{--ease:cubic-bezier(.16,1,.3,1)}
</style>
<style>
:root{--chat-c:#0899B2;--chat-c2:#0779a0;--chat-bg:#fff;--chat-panel:#f8fafc;--chat-bd:#e2e8f0;--chat-txt:#0d1117;--chat-muted:#64748b}
.chat-float{position:fixed;bottom:24px;right:24px;z-index:9990;display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.chat-bubble-btn{width:60px;height:60px;border-radius:50%;background:var(--chat-c);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 24px rgba(8,153,178,.45);transition:transform .2s,box-shadow .2s;position:relative;animation:chatbounce 3s ease infinite}
.chat-bubble-btn:hover{transform:scale(1.1)!important;box-shadow:0 8px 32px rgba(8,153,178,.55);animation:none}
.chat-bubble-btn svg{color:#fff;transition:opacity .2s}
@keyframes chatbounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.chat-pulse{position:absolute;inset:-5px;border-radius:50%;border:2px solid rgba(8,153,178,.35);animation:chatripple 2.5s ease-out infinite}
@keyframes chatripple{0%{transform:scale(1);opacity:1}100%{transform:scale(1.5);opacity:0}}
.chat-notif{position:absolute;top:-4px;right:-4px;width:20px;height:20px;border-radius:50%;background:#ef4444;color:#fff;font-size:.65rem;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #fff;animation:notifpop .4s var(--ease)}
@keyframes notifpop{from{transform:scale(0)}to{transform:scale(1)}}
.chat-teaser{background:#fff;border:1px solid var(--chat-bd);border-radius:12px;padding:10px 14px;font-size:.82rem;font-weight:600;color:var(--chat-txt);box-shadow:0 4px 16px rgba(0,0,0,.1);animation:teaserslide .5s var(--ease);max-width:220px;line-height:1.4;cursor:pointer}
@keyframes teaserslide{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* PANEL */
.chat-panel{position:fixed;bottom:96px;right:24px;width:370px;height:560px;background:var(--chat-bg);border:1px solid var(--chat-bd);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.18);display:flex;flex-direction:column;overflow:hidden;z-index:9989;transform:scale(.9) translateY(20px);opacity:0;pointer-events:none;transition:transform .35s var(--ease),opacity .35s var(--ease)}
.chat-panel.open{transform:scale(1) translateY(0);opacity:1;pointer-events:all}
@media(max-width:480px){.chat-panel{width:calc(100vw - 24px);right:12px;bottom:88px;height:70vh}}

/* HEADER */
.chat-head{background:var(--chat-c);padding:16px 18px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.sdr-av{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem;color:#fff;flex-shrink:0;border:2px solid rgba(255,255,255,.3)}
.sdr-info{flex:1;min-width:0}
.sdr-name{font-weight:700;font-size:.92rem;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sdr-status{display:flex;align-items:center;gap:5px;font-size:.72rem;color:rgba(255,255,255,.8);margin-top:1px}
.sdr-dot{width:6px;height:6px;border-radius:50%;background:#4ade80;flex-shrink:0;animation:pulse-g 2s ease infinite}
@keyframes pulse-g{0%,100%{opacity:1}50%{opacity:.4}}
.chat-close-btn{background:rgba(255,255,255,.15);border:none;border-radius:8px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;font-size:1rem;transition:background .2s;flex-shrink:0}
.chat-close-btn:hover{background:rgba(255,255,255,.25)}

/* MESSAGES */
.chat-msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--chat-panel)}
.chat-msgs::-webkit-scrollbar{width:3px}
.chat-msgs::-webkit-scrollbar-thumb{background:var(--chat-bd);border-radius:2px}
.msg{display:flex;gap:8px;align-items:flex-end;animation:msgin .3s var(--ease)}
@keyframes msgin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg.bot{align-self:flex-start;max-width:88%}
.msg.usr{align-self:flex-end;flex-direction:row-reverse;max-width:88%}
.msg-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:800;color:#fff;flex-shrink:0}
.msg-bubble{padding:10px 14px;border-radius:16px;font-size:.84rem;line-height:1.55;word-break:break-word}
.msg.bot .msg-bubble{background:#fff;color:var(--chat-txt);border:1px solid var(--chat-bd);border-bottom-left-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.msg.usr .msg-bubble{background:var(--chat-c);color:#fff;border-bottom-right-radius:4px}
.msg-time{font-size:.65rem;color:var(--chat-muted);margin-top:3px;align-self:flex-end;padding:0 4px}

/* TYPING */
.typing-dots{display:flex;align-items:center;gap:4px;padding:12px 16px}
.typing-dots span{width:7px;height:7px;border-radius:50%;background:var(--chat-muted);animation:tdot 1.2s ease infinite}
.typing-dots span:nth-child(2){animation-delay:.15s}
.typing-dots span:nth-child(3){animation-delay:.3s}
@keyframes tdot{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-5px);opacity:1}}

/* QUICK REPLIES */
.quick-replies{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 10px;background:var(--chat-panel)}
.qr-btn{background:#fff;border:1px solid var(--chat-c);color:var(--chat-c);border-radius:100px;padding:6px 14px;font-size:.78rem;font-weight:600;cursor:pointer;transition:background .2s,color .2s;white-space:nowrap}
.qr-btn:hover{background:var(--chat-c);color:#fff}

/* LEAD CARD */
.lead-card{background:linear-gradient(135deg,var(--chat-c),var(--chat-c2));border-radius:14px;padding:16px;margin:8px 0;color:#fff}
.lead-card-title{font-weight:800;font-size:.88rem;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.lead-card-body{font-size:.78rem;line-height:1.6;opacity:.92}
.btn-wpp-chat{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:#25d366;color:#fff;border:none;border-radius:10px;padding:12px;font-weight:700;font-size:.88rem;cursor:pointer;margin-top:10px;transition:background .2s}
.btn-wpp-chat:hover{background:#1da851}

/* INPUT */
.chat-input-wrap{padding:12px 14px;border-top:1px solid var(--chat-bd);display:flex;gap:8px;background:#fff;flex-shrink:0}
#chatInput{flex:1;border:1px solid var(--chat-bd);border-radius:10px;padding:9px 14px;font-size:.84rem;outline:none;font-family:'Open Sans',Verdana,sans-serif;color:var(--chat-txt);background:var(--chat-panel);transition:border-color .2s;resize:none;max-height:80px;overflow-y:auto}
#chatInput:focus{border-color:var(--chat-c)}
#chatInput::placeholder{color:var(--chat-muted)}
#chatSend{width:38px;height:38px;border-radius:10px;background:var(--chat-c);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;transition:background .2s,transform .2s;flex-shrink:0;align-self:flex-end}
#chatSend:hover{background:var(--chat-c2);transform:scale(1.05)}
#chatSend:disabled{opacity:.4;cursor:not-allowed}

.chat-powered{text-align:center;font-size:.65rem;color:var(--chat-muted);padding:6px 0 2px;background:#fff}
</style>
</head>
<body>
<h1>Teste do Chat SDR — Clube Meta</h1>
<p style="text-align:center;color:#666">Clique na bolinha no canto inferior direito 👉</p>

<!-- CHATBOT HTML -->
<div class="chat-float" id="chatFloat">
  <div class="chat-teaser" id="chatTeaser" onclick="openChat()">
    💬 Fale com nossa especialista<br><span style="color:var(--chat-c);font-size:.75rem">Diagnóstico gratuito em minutos</span>
  </div>
  <button class="chat-bubble-btn" id="chatBtn" onclick="toggleChat()" aria-label="Abrir chat">
    <div class="chat-pulse"></div>
    <div class="chat-notif" id="chatNotif">1</div>
    <svg id="chatIconOpen" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
    <svg id="chatIconClose" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="display:none"><path d="M18 6L6 18M6 6l12 12"/></svg>
  </button>
</div>

<div class="chat-panel" id="chatPanel">
  <div class="chat-head">
    <div class="sdr-av" id="sdrAv"></div>
    <div class="sdr-info">
      <div class="sdr-name" id="sdrName"></div>
      <div class="sdr-status"><div class="sdr-dot"></div><span id="sdrRole"></span></div>
    </div>
    <button class="chat-close-btn" onclick="toggleChat()">✕</button>
  </div>
  <div class="chat-msgs" id="chatMsgs"></div>
  <div class="quick-replies" id="quickReplies"></div>
  <div class="chat-input-wrap">
    <textarea id="chatInput" placeholder="Digite sua mensagem..." rows="1"></textarea>
    <button id="chatSend" onclick="sendMessage()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>
  <div class="chat-powered">⚡ Powered by Claude AI · Clube Meta</div>
</div>



<!-- CHATBOT SCRIPT -->
<script>
// ══ CONFIG ══
const CM_WPP = '5586999923244';
const SUPABASE_URL = 'https://iyjmpbqpifvzitulccky.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml5am1wYnFwaWZ2eml0dWxjY2t5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1MTM1NjEsImV4cCI6MjA5NjA4OTU2MX0.VFV6Kx44ZxmzgPcqv7DC3DgRqVppug1IvdRy2C_O4uE';
const STORAGE_KEY = 'cm_lead';

// ══ UTM ══
function getUTMs() {
  const p = new URLSearchParams(window.location.search);
  return {
    utm_source: p.get('utm_source')||'',
    utm_medium: p.get('utm_medium')||'',
    utm_campaign: p.get('utm_campaign')||'',
    utm_content: p.get('utm_content')||'',
    utm_term: p.get('utm_term')||'',
    pagina_origem: window.location.href
  };
}
const utms = getUTMs();

// ══ IDENTIFICAR LEAD RETORNANDO ══
function getSavedLead() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch { return null; }
}
function saveLead(lead) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(lead)); } catch {}
}

// Busca lead no Supabase por WhatsApp ou email
async function findLeadInDB(whatsapp, email) {
  try {
    let url = `${SUPABASE_URL}/rest/v1/clubemeta_leads?select=nome,whatsapp,email,instagram,nicho,faturamento,meta_90_dias&limit=1`;
    if (whatsapp) url += `&whatsapp=eq.${encodeURIComponent(whatsapp)}`;
    else if (email) url += `&email=eq.${encodeURIComponent(email)}`;
    else return null;
    const res = await fetch(url, {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
    });
    const data = await res.json();
    return data && data.length > 0 ? data[0] : null;
  } catch { return null; }
}

// ══ PERSONAS ══
const SDRS = [
  {name:'Mariana Alves', role:'Especialista · Nicho Médico & Saúde', initials:'MA', bg:'#a78bfa'},
  {name:'Fernanda Nunes', role:'Especialista · Concursos & Infoprodutos', initials:'FN', bg:'#0899B2'},
  {name:'Juliana Castro', role:'Especialista · E-commerce & Negócios Locais', initials:'JC', bg:'#34d399'}
];
const sdr = SDRS[Math.floor(Math.random()*SDRS.length)];

// ══ SYSTEM PROMPT ══
function buildSystemPrompt(returning, existingData) {
  const returningContext = returning && existingData ? `
ATENÇÃO — LEAD JÁ IDENTIFICADO:
Este lead já conversou com a Clube Meta antes. Dados que já temos:
- Nome: ${existingData.nome}
- WhatsApp: ${existingData.whatsapp}
- Nicho: ${existingData.nicho}
- Faturamento anterior: ${existingData.faturamento}
- Meta anterior: ${existingData.meta_90_dias}

Cumprimente pelo nome, mencione que já se conhecem, pergunte como está evoluindo o negócio desde a última conversa e se gostaria de falar com um estrategista agora. Não repita perguntas que já foram respondidas — apenas atualize o que mudou.
` : '';

  return `Você é ${sdr.name}, SDR especialista da Clube Meta — agência fundada por Luciano Barros que já gerenciou mais de R$50 milhões em tráfego pago e estratégias de vendas com IA.

PERSONALIDADE: Consultiva, direta, empática e confiante. Linguagem informal mas profissional. Autoridade com proximidade.
${returningContext}
OBJETIVO: Coletar as seguintes informações de forma NATURAL e CONVERSACIONAL (não como questionário):
1. Nome completo
2. WhatsApp (com DDD)
3. E-mail
4. Instagram (@ do perfil)
5. Tipo de negócio / nicho
6. Faturamento mensal atual
7. Se já investe em tráfego e qual plataforma
8. Valor investido por mês em anúncios
9. Maior dor com marketing/vendas hoje
10. Se tem estrutura: landing page, funil, CRM, equipe
11. O que acontece com o lead após captação
12. Meta para os próximos 90 dias
13. Cidade e estado

REGRAS:
- Máximo 2 perguntas por mensagem
- Use o nome assim que souber
- Dê micro-insights do mercado deles para demonstrar autoridade
- NUNCA diga que é IA ou bot. Se perguntarem: "sou especialista da Clube Meta"
- Respostas curtas (2-4 frases), emojis com moderação (máx 2)
- Ao identificar o WhatsApp ou email do lead, aguarde — o sistema vai verificar automaticamente se é um lead existente

QUANDO TIVER TODOS OS DADOS, envie no final (não será mostrado):
[[LEAD]]nome=[nome]&whatsapp=[wpp]&email=[email]&instagram=[ig]&nicho=[nicho]&faturamento=[fat]&plataforma=[plat]&investimento=[inv]&desafio=[desafio]&estrutura=[estrutura]&pos_captacao=[pos]&meta=[meta]&cidade=[cidade][[/LEAD]]`;
}

// ══ ESTADO ══
let chatOpen = false, convHistory = [], isTyping = false, qualified = false;
let existingLead = null, isReturning = false;
let leadDataCollected = {};

// ══ INIT UI ══
document.getElementById('sdrAv').textContent = sdr.initials;
document.getElementById('sdrAv').style.background = sdr.bg;
document.getElementById('sdrName').textContent = sdr.name;
document.getElementById('sdrRole').textContent = sdr.role;

setTimeout(()=>{
  const t=document.getElementById('chatTeaser');
  if(t&&!chatOpen){t.style.opacity='0';t.style.transition='opacity .5s';setTimeout(()=>{if(!chatOpen)t.style.display='none'},500);}
}, 9000);

document.getElementById('chatInput').addEventListener('keydown', e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}
});
document.getElementById('chatInput').addEventListener('input', function(){
  this.style.height='auto';
  this.style.height=Math.min(this.scrollHeight,80)+'px';
});

function openChat(){if(!chatOpen)toggleChat();}
function toggleChat(){
  chatOpen=!chatOpen;
  document.getElementById('chatPanel').classList.toggle('open',chatOpen);
  document.getElementById('chatIconOpen').style.display=chatOpen?'none':'block';
  document.getElementById('chatIconClose').style.display=chatOpen?'block':'none';
  document.getElementById('chatBtn').style.animation=chatOpen?'none':'chatbounce 3s ease infinite';
  const notif=document.getElementById('chatNotif');if(notif)notif.remove();
  const teaser=document.getElementById('chatTeaser');if(teaser)teaser.style.display='none';
  if(chatOpen&&convHistory.length===0)startConversation();
  if(chatOpen)setTimeout(()=>document.getElementById('chatInput').focus(),400);
}

async function startConversation(){
  // Verifica lead salvo localmente
  const saved = getSavedLead();
  if(saved && saved.nome){
    isReturning = true;
    existingLead = saved;
    await delay(600);
    showReturningBadge(saved.nome);
    addBotMsg(`Olá de novo, **${saved.nome}**! 👋

Que bom te ver por aqui! Lembro que você atua no nicho de **${saved.nicho||'negócios'}**.

Como está indo? Evoluiu desde nossa última conversa? Me conta — posso te conectar com um estrategista agora mesmo! 🚀`);
  } else {
    await delay(600);
    addBotMsg(`Olá! 👋 Sou ${sdr.name}, especialista da **Clube Meta**.

Estou aqui para fazer um diagnóstico rápido do seu negócio — sem enrolação.

Começa me dizendo: qual o seu **nome** e **WhatsApp**? 😊`);
  }
}

function showReturningBadge(nome){
  const msgs = document.getElementById('chatMsgs');
  const badge = document.createElement('div');
  badge.style.cssText = 'text-align:center;padding:8px;font-size:.72rem;color:#0899B2;font-weight:700;background:rgba(8,153,178,.08);border-radius:8px;margin:4px 0;';
  badge.innerHTML = `🔁 Lead identificado · ${nome}`;
  msgs.appendChild(badge);
}

async function sendMessage(){
  const input=document.getElementById('chatInput');
  const text=input.value.trim();
  if(!text||isTyping||qualified)return;
  input.value='';input.style.height='auto';
  addUserMsg(text);
  setQuickReplies([]);

  // Tenta identificar WhatsApp ou email na mensagem para buscar no banco
  if(!isReturning){
    const wppMatch = text.match(/(\d{10,11})/);
    const emailMatch = text.match(/[\w.-]+@[\w.-]+\.\w+/);
    if(wppMatch || emailMatch){
      const found = await findLeadInDB(wppMatch?wppMatch[1]:null, emailMatch?emailMatch[0]:null);
      if(found){
        isReturning = true;
        existingLead = found;
        saveLead(found);
        // Injeta contexto no próximo turno da IA
        convHistory.push({role:'user',content:`[SISTEMA: Lead identificado no banco de dados. Nome: ${found.nome}, Nicho: ${found.nicho}, já conversou antes]`});
      }
    }
  }

  await getAIResponse(text);
}

function addUserMsg(text){
  convHistory.push({role:'user',content:text});
  const msgs=document.getElementById('chatMsgs');
  const el=document.createElement('div');
  el.className='msg usr';
  el.innerHTML=`<div class="msg-bubble">${escHtml(text)}</div><div class="msg-time">${getTime()}</div>`;
  msgs.appendChild(el);scrollBottom();
}

function addBotMsg(text){
  const msgs=document.getElementById('chatMsgs');
  const el=document.createElement('div');
  el.className='msg bot';
  const fmt=escHtml(text).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/
/g,'<br>');
  el.innerHTML=`<div class="msg-av" style="background:${sdr.bg}">${sdr.initials}</div><div><div class="msg-bubble">${fmt}</div><div class="msg-time">${getTime()}</div></div>`;
  msgs.appendChild(el);scrollBottom();
}

function showTyping(){
  const msgs=document.getElementById('chatMsgs');
  const el=document.createElement('div');
  el.className='msg bot';el.id='typingIndicator';
  el.innerHTML=`<div class="msg-av" style="background:${sdr.bg}">${sdr.initials}</div><div class="msg-bubble" style="padding:4px 8px"><div class="typing-dots"><span></span><span></span><span></span></div></div>`;
  msgs.appendChild(el);scrollBottom();
  isTyping=true;document.getElementById('chatSend').disabled=true;
}

function hideTyping(){
  const el=document.getElementById('typingIndicator');if(el)el.remove();
  isTyping=false;document.getElementById('chatSend').disabled=false;
}

function setQuickReplies(opts){
  const qr=document.getElementById('quickReplies');qr.innerHTML='';
  opts.forEach(opt=>{
    const btn=document.createElement('button');
    btn.className='qr-btn';btn.textContent=opt;
    btn.onclick=()=>{document.getElementById('chatInput').value=opt;sendMessage();};
    qr.appendChild(btn);
  });
}

async function getAIResponse(userMsg){
  showTyping();
  const apiMessages=convHistory.map(m=>({role:m.role,content:m.content}));
  await delay(700+Math.random()*500);
  try{
    const res=await fetch('/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-haiku-4-5-20251001',
        max_tokens:450,
        system: buildSystemPrompt(isReturning, existingLead),
        messages: apiMessages
      })
    });
    if(!res.ok)throw new Error('API error');
    const data=await res.json();
    const fullText=data.content[0].text;
    const leadMatch=fullText.match(/\[\[LEAD\]\](.*?)\[\[\/LEAD\]\]/s);
    const displayText=fullText.replace(/\[\[LEAD\]\].*?\[\[\/LEAD\]\]/s,'').trim();
    hideTyping();
    convHistory.push({role:'assistant',content:fullText});
    await delay(150);
    addBotMsg(displayText);
    if(leadMatch){qualified=true;await delay(800);processLead(leadMatch[1]);}
    else suggestQR(displayText);
  }catch(err){
    hideTyping();
    addBotMsg('Hmm, tive um probleminha aqui. Pode repetir? 😅');
  }
}

async function processLead(rawData){
  const p=new URLSearchParams(rawData);
  const lead={
    nome:p.get('nome')||existingLead?.nome||'',
    whatsapp:p.get('wpp')||existingLead?.whatsapp||'',
    email:p.get('email')||existingLead?.email||'',
    instagram:p.get('ig')||existingLead?.instagram||'',
    nicho:p.get('nicho')||existingLead?.nicho||'',
    faturamento:p.get('fat')||existingLead?.faturamento||'',
    plataforma:p.get('plat')||'',
    investimento:p.get('inv')||'',
    desafio:p.get('desafio')||'',
    estrutura:p.get('estrutura')||'',
    pos_captacao:p.get('pos')||'',
    meta_90_dias:p.get('meta')||existingLead?.meta_90_dias||'',
    cidade:p.get('cidade')||'',
    sdr_atendente:sdr.name,
    conversa:convHistory,
    lead_retornando: isReturning,
    ...utms
  };
  saveLead(lead);
  try{
    await fetch(`${SUPABASE_URL}/rest/v1/clubemeta_leads`,{
      method:'POST',
      headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`,'Prefer':'return=minimal'},
      body:JSON.stringify(lead)
    });
  }catch(e){}
  showLeadCard(lead);
}

function showLeadCard(lead){

  const card=document.createElement('div');
  card.className='lead-card';
  const badge = isReturning ? '<span style="background:rgba(255,255,255,.2);border-radius:20px;padding:2px 10px;font-size:.7rem;margin-left:8px">🔁 Retornando</span>' : '';

    <div class="lead-card-title">✅ Diagnóstico Concluído!${badge}</div>
    <div class="lead-card-body">
      👤 <strong>${escHtml(lead.nome)}</strong><br>
      📱 ${escHtml(lead.whatsapp)}<br>
      ✉️ ${escHtml(lead.email)}<br>
      📸 ${escHtml(lead.instagram)}<br>
      🏢 ${escHtml(lead.nicho)} · ${escHtml(lead.faturamento)}<br>

    </div>
    <button class="btn-wpp-chat" onclick='sendToWpp(${JSON.stringify(lead)})'>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
      Falar com um estrategista agora
    </button>`;
  msgs.appendChild(card);scrollBottom();
  document.getElementById('chatInput').disabled=true;
  document.getElementById('chatSend').disabled=true;
  document.getElementById('chatInput').placeholder='Conversa concluída ✅';
}

function sendToWpp(lead){
  const retorno = lead.lead_retornando ? '
🔁 *Lead retornando*' : '';
  const utm = utms.utm_source ? `
📡 *UTM:* ${utms.utm_source} / ${utms.utm_campaign}` : '';
  const msg=`🤖 *LEAD QUALIFICADO — CLUBE META*${retorno}
👤 *Nome:* ${lead.nome}
📱 *WhatsApp:* ${lead.whatsapp}
✉️ *E-mail:* ${lead.email}
📸 *Instagram:* ${lead.instagram}
🏢 *Nicho:* ${lead.nicho}
💰 *Faturamento:* ${lead.faturamento}
📡 *Tráfego:* ${lead.plataforma} · ${lead.investimento}/mês
😰 *Desafio:* ${lead.desafio}
🎯 *Meta 90 dias:* ${lead.meta_90_dias}
📍 *Cidade:* ${lead.cidade}
🤝 *SDR:* ${lead.sdr_atendente}${utm}

✅ _Salvo no Supabase · Clube Meta_`;
  window.open(`https://wa.me/${CM_WPP}?text=${encodeURIComponent(msg)}`,'_blank');
}

function suggestQR(text){
  const t=text.toLowerCase();
  if(t.includes('faturamento')||(t.includes('quanto')&&t.includes('mês')))
    setQuickReplies(['Menos de R$10k','R$10k–50k','R$50k–200k','Acima de R$200k']);
  else if(t.includes('plataforma')||t.includes('anunciar')||t.includes('investe'))
    setQuickReplies(['Meta Ads','Google Ads','Ambas','Não invisto ainda']);
  else if(t.includes('equipe')||t.includes('sozinho'))
    setQuickReplies(['Trabalho sozinho','Tenho equipe pequena','Equipe estruturada']);
  else setQuickReplies([]);
}

function scrollBottom(){const m=document.getElementById('chatMsgs');m.scrollTop=m.scrollHeight;}
function getTime(){return new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});}
function delay(ms){return new Promise(r=>setTimeout(r,ms));}
function escHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
</script>
